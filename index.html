<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | อสม. พลัส</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #009688; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        button:disabled { background: #aaa; }
        #status { margin-top: 15px; color: red; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>อสม. พลัส</h2>
        <input type="text" id="username" placeholder="ชื่อผู้ใช้งาน (User)">
        <input type="password" id="password" placeholder="รหัสผ่าน (Password)">
        <button id="btnLogin" onclick="callLoginAPI()">เข้าสู่ระบบ</button>
        <div id="status"></div>
    </div>

    <script>
        // ⭐️ นำ Web App URL ของคุณมาวางในเครื่องหมายคำพูดด้านล่างนี้ ⭐️
        const API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTZ1mFAmoJHDcYCAqQFh-rhg-_1HNHEDzvK4iUdP9S3sQd7lF4exUvlNQLTMIw-QAGjno405vgcVPnduNAYNFXJJhr3o4us659OtYrnIA4XK2tFYENWb9XgwnYnMQlgnTqCuzMNy5Te1JX6nxrj6FdAF1-jWQOHzZlY_BzDivFjWO5__wIzKOCnesUmYsxXGSYlbFeSBotqN187zwQtJDy7X6qcmxiHNYS0mX6NG54e8D1KChkk9I9Vl7A3bGEvnjEzh0rZaoudUSMnoC_skTlVUTJnfQ&lib=MABGznnOEKRq9jPjJVMWEbdmUw58ct1sv";

        async function callLoginAPI() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const statusDiv = document.getElementById("status");
            const btn = document.getElementById("btnLogin");

            if (!user || !pass) {
                statusDiv.innerText = "กรุณากรอกข้อมูลให้ครบถ้วน";
                statusDiv.style.color = "red";
                return;
            }

            statusDiv.innerText = "กำลังตรวจสอบข้อมูล...";
            statusDiv.style.color = "blue";
            btn.disabled = true;

            // จัดเตรียมข้อมูลเพื่อส่งไปหา API
            const payload = {
                action: "login",
                username: user,
                password: pass
            };

            try {
                // 🚀 ใช้คำสั่ง fetch() ยิงข้อมูลข้ามเซิร์ฟเวอร์
                const response = await fetch(API_URL, {
                    method: "POST",
                    // ⚠️ ต้องใช้ text/plain เพื่อป้องกัน Google บล็อก (CORS Policy)
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });

                // รับผลลัพธ์กลับมาเป็น JSON
                const result = await response.json();

                if (result.success) {
                    statusDiv.innerText = "✅ เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับคุณ: " + result.fullname;
                    statusDiv.style.color = "green";
                    console.log("ข้อมูล User:", result);
                    // (อนาคต: เขียนโค้ดสั่งให้เปลี่ยนหน้าเว็บตรงนี้)
                } else {
                    statusDiv.innerText = "❌ " + result.message;
                    statusDiv.style.color = "red";
                }
            } catch (error) {
                statusDiv.innerText = "❌ การเชื่อมต่อขัดข้อง: " + error.message;
                statusDiv.style.color = "red";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
